server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # O charset entra no cabecalho da resposta, e nao so na etiqueta do HTML.
    charset utf-8;

    # Nao anunciar a versao do nginx.
    server_tokens off;

    # ---------------------------------------------------------------
    # Compressao. Sem isto o HTML sai com 58 KB crus. Com gzip cai para
    # perto de 18 KB, 74% menor. WebP e PNG ficam de fora porque ja sao
    # formatos comprimidos. SVG entra, porque e texto e comprime muito bem.
    # ---------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/ld+json
        image/svg+xml;

    # ---------------------------------------------------------------
    # Cabecalhos de seguranca.
    #
    # ATENCAO ao mexer: no nginx, um location que declara add_header perde
    # TODOS os add_header do nivel de cima. Por isso o cache dos arquivos
    # abaixo usa a diretiva expires, e nao add_header. Se algum dia voltar
    # add_header para dentro de um location, os cabecalhos daqui somem
    # naquele caminho, em silencio.
    # ---------------------------------------------------------------

    # Obriga o navegador a so falar com o site por HTTPS. O navegador ignora
    # este cabecalho quando a resposta vem por HTTP, entao e seguro deixar
    # ligado mesmo com o certificado terminando no proxy do EasyPanel.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Impede que a pagina seja colocada dentro de outro site, que e como se
    # monta tela falsa em cima de site verdadeiro.
    add_header X-Frame-Options "DENY" always;

    # Impede o navegador de adivinhar o tipo do arquivo.
    add_header X-Content-Type-Options "nosniff" always;

    # Nao vaza o endereco completo da pagina para sites de terceiros.
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # O site nao usa nenhum destes recursos, entao ficam bloqueados.
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;

    # De onde a pagina pode carregar coisas. Depois que a fonte passou a ser
    # hospedada aqui, o site nao busca NADA de fora, entao a regra e fechada.
    #
    # 'unsafe-inline' e necessario porque o CSS e o JavaScript sao embutidos
    # no proprio HTML. Enfraquece a defesa contra injecao, mas como o site nao
    # tem nenhuma entrada de dados, o risco restante e baixo.
    #
    # SE UM DIA LIGAR O GOOGLE ANALYTICS, e preciso acrescentar
    # https://www.googletagmanager.com em script-src e
    # https://*.google-analytics.com em connect-src e img-src,
    # senao a medicao simplesmente nao funciona e nao avisa.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests" always;

    location / {
        try_files $uri $uri/ =404;
    }

    # O index.html nunca fica preso no cache do aparelho. Sem isto, o celular
    # continua abrindo a versao antiga da pagina depois de um deploy novo, e
    # mistura HTML velho com imagem nova, o que quebra o layout.
    location = /index.html {
        expires -1;
    }

    # O estilo.css e o script.js NAO levam expires de proposito.
    #
    # Sem a diretiva, o nginx ainda manda ETag e Last-Modified, entao o navegador
    # pergunta se mudou e recebe 304 quando nao mudou. Custa uma ida ao servidor
    # e nao custa os bytes. Se levassem expires, um deploy poderia entregar HTML
    # novo com CSS velho preso no cache, que e o mesmo defeito que o index.html
    # evita logo acima, so que espalhado por todas as paginas.
    #
    # No dia em que o nome dos arquivos levar versao, tipo estilo.4f2a.css, ai sim
    # vale por expires longo.

    # As imagens podem ficar um dia guardadas, porque sao pesadas e mudam pouco.
    location ~* \.(png|webp|svg|ico|jpg|jpeg)$ {
        expires 1d;
    }

    # A fonte fica hospedada junto do site e so muda se trocar de nome, entao
    # pode ficar guardada por bastante tempo.
    location ~* \.woff2$ {
        expires 30d;
    }
}
